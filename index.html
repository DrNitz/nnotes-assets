<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N-Notes Assets</title>
  <style>
    :root {
      --paper: #96938B;
      --ink: #14141A;
      --secondary: #26262B;
      --accent: #0A2266;
      --line: #45433E;
      --field: #FFFFFF;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    a, button { cursor: pointer; }
    button:disabled { cursor: not-allowed; }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .skip {
      position: absolute;
      left: -9999px;
      top: 8px;
      background: var(--field);
      color: var(--ink);
      padding: 10px 14px;
      z-index: 10;
    }
    .skip:focus { left: 12px; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    header {
      border-bottom: 1px solid var(--line);
      padding: 30px 32px 24px;
    }

    .masthead {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px 32px;
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 3.5vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.045em;
      line-height: 1;
    }

    .intro {
      margin: 8px 0 0;
      color: var(--secondary);
      font-size: 0.9375rem;
    }

    .search-bar { flex: 1 1 320px; max-width: 460px; }

    .search-bar input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 0;
      background: var(--field);
      color: var(--ink);
      font: inherit;
    }

    .search-bar input::placeholder { color: var(--secondary); }

    .layout {
      display: grid;
      grid-template-columns: 236px minmax(0, 1fr);
      gap: 36px;
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px 32px 64px;
    }

    .rail {
      align-self: start;
      position: sticky;
      top: 20px;
    }

    .rail-label {
      margin: 0 0 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--line);
      color: var(--secondary);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .tabs, .categories {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin: 0 0 28px;
      padding: 0;
    }

    .tab, .chip {
      min-height: 44px;
      text-align: left;
      background: none;
      border: 0;
      border-left: 3px solid transparent;
      border-radius: 0;
      padding: 10px 12px;
      color: var(--secondary);
      font: inherit;
      font-size: 0.9375rem;
    }

    .tab[aria-pressed="true"], .chip[aria-pressed="true"] {
      color: var(--ink);
      border-left-color: var(--accent);
      font-weight: 600;
    }

    .status {
      margin: 0 0 22px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      color: var(--secondary);
      font-size: 0.875rem;
    }
    .status button {
      background: none;
      border: 0;
      padding: 0;
      color: var(--accent);
      font: inherit;
      text-decoration: underline;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(176px, 1fr));
      gap: 28px 20px;
    }

    .asset { margin: 0; min-width: 0; }

    .asset-preview { display: block; }

    .asset-preview img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
    }

    .asset-name {
      margin-top: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .asset-actions {
      margin-top: 2px;
      display: flex;
      gap: 14px;
      font-size: 0.75rem;
    }

    .asset-actions a {
      color: var(--secondary);
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }
    .asset-actions a:hover { border-bottom-color: var(--accent); color: var(--ink); }

    footer {
      border-top: 1px solid var(--line);
      padding: 20px 32px 32px;
      color: var(--secondary);
      font-size: 0.8125rem;
    }
    footer p { max-width: 1400px; margin: 0 auto; }
    footer a { color: var(--accent); }

    @media (max-width: 900px) {
      header { padding: 22px 20px 18px; }
      .layout { grid-template-columns: 1fr; gap: 22px; padding: 20px 20px 48px; }
      .rail { position: static; }
      .tabs, .categories { flex-direction: row; overflow-x: auto; margin-bottom: 18px; }
      .tab, .chip { white-space: nowrap; border-left: 0; border-bottom: 3px solid transparent; }
      .tab[aria-pressed="true"], .chip[aria-pressed="true"] { border-left: 0; border-bottom-color: var(--accent); }
      .grid { grid-template-columns: repeat(auto-fill, minmax(136px, 1fr)); gap: 22px 14px; }
      footer { padding: 18px 20px 28px; }
    }

    @media (max-width: 480px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 18px 10px; }
      .asset-actions { gap: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#grid">Skip to assets</a>

  <header>
    <div class="masthead">
      <div>
        <h1>N-Notes Assets</h1>
        <p class="intro">Stickers and frames for note apps.</p>
      </div>
      <div class="search-bar">
        <label class="sr-only" for="searchInput">Search assets</label>
        <input id="searchInput" type="search" placeholder="Search stickers, frames, SVGs" autocomplete="off">
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="rail" aria-label="Asset filters">
      <p class="rail-label">Collection</p>
      <nav class="tabs" aria-label="Asset collections">
        <button class="tab" type="button" data-tab="stickers" aria-pressed="true">Stickers</button>
        <button class="tab" type="button" data-tab="individual" aria-pressed="false">Sticker Library</button>
        <button class="tab" type="button" data-tab="frames" aria-pressed="false">Frames</button>
      </nav>
      <p class="rail-label">Categories</p>
      <div class="categories" id="categoryContainer" aria-label="Categories"></div>
    </aside>

    <main>
      <p class="status" id="status" role="status" aria-live="polite">Loading assets from GitHub...</p>
      <div class="grid" id="grid"></div>
    </main>
  </div>

  <footer>
    <p>Assets hosted on GitHub. Made by <a href="https://drnitz.com" target="_blank" rel="noopener">drnitz.com</a>.</p>
  </footer>

  <script>
    const API_BASE = "https://raw.githubusercontent.com/DrNitz/nnotes-assets/main";

    const databases = { stickers: [], individual: [], frames: [] };
    let currentTab = "stickers";
    let currentCategory = "All Categories";
    let searchQuery = "";

    const grid = document.getElementById("grid");
    const statusEl = document.getElementById("status");
    const searchInput = document.getElementById("searchInput");
    const tabs = Array.from(document.querySelectorAll(".tab"));
    const categories = document.getElementById("categoryContainer");

    function parseJsonToFlatList(data) {
      const list = [];
      if (!data || !Array.isArray(data.categories)) return list;
      data.categories.forEach(cat => {
        if (!Array.isArray(cat.images)) return;
        cat.images.forEach(img => {
          list.push({
            id: img.id || "",
            title: img.title || "Untitled",
            tags: Array.isArray(img.tags) ? img.tags : [],
            url: img.url || "",
            category: cat.name || "Uncategorized"
          });
        });
      });
      return list;
    }

    async function init() {
      statusEl.textContent = "Loading assets from GitHub...";
      const sources = [
        ["stickers", "stickers_data.json"],
        ["individual", "stickers_individual_data.json"],
        ["frames", "frames_data.json"]
      ];
      const results = await Promise.all(sources.map(async ([key, file]) => {
        try {
          const res = await fetch(`${API_BASE}/${file}`);
          if (!res.ok) return [key, null];
          return [key, parseJsonToFlatList(await res.json())];
        } catch (err) {
          return [key, null];
        }
      }));

      let loaded = 0;
      results.forEach(([key, data]) => {
        if (data) {
          databases[key] = data;
          loaded += 1;
        }
      });

      if (loaded === 0) {
        showError();
        return;
      }
      render();
    }

    function showError() {
      grid.replaceChildren();
      statusEl.replaceChildren();
      statusEl.append(document.createTextNode("Could not load assets. Check the JSON files in the repository. "));
      const retry = document.createElement("button");
      retry.type = "button";
      retry.textContent = "Retry";
      retry.addEventListener("click", init);
      statusEl.append(retry);
    }

    function renderCategories(data) {
      categories.replaceChildren();
      const names = [...new Set(data.map(item => item.category))].sort((a, b) => a.localeCompare(b));
      const all = document.createElement("button");
      all.type = "button";
      all.className = "chip";
      all.textContent = "All Categories";
      all.dataset.cat = "All Categories";
      all.setAttribute("aria-pressed", String(currentCategory === "All Categories"));
      all.addEventListener("click", () => {
        currentCategory = "All Categories";
        render();
      });
      categories.append(all);

      names.forEach(name => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        chip.textContent = name;
        chip.dataset.cat = name;
        chip.setAttribute("aria-pressed", String(currentCategory === name));
        chip.addEventListener("click", () => {
          currentCategory = name;
          render();
        });
        categories.append(chip);
      });
    }

    function buildAsset(item) {
      const figure = document.createElement("figure");
      figure.className = "asset";

      const preview = document.createElement("a");
      preview.className = "asset-preview";
      preview.href = item.url;
      preview.target = "_blank";
      preview.rel = "noopener";
      preview.setAttribute("aria-label", `Open ${item.title}`);
      const img = document.createElement("img");
      img.src = item.url;
      img.alt = item.title;
      img.width = 120;
      img.height = 120;
      img.loading = "lazy";
      preview.append(img);
      figure.append(preview);

      const name = document.createElement("div");
      name.className = "asset-name";
      name.textContent = item.title;
      figure.append(name);

      const actions = document.createElement("div");
      actions.className = "asset-actions";
      const save = document.createElement("a");
      save.href = item.url;
      save.download = "";
      save.textContent = "Save";
      save.title = "Save or open the asset file";
      actions.append(save);
      figure.append(actions);

      return figure;
    }

    function render() {
      const data = databases[currentTab];
      renderCategories(data);

      let filtered = data;
      if (currentCategory !== "All Categories") {
        filtered = filtered.filter(item => item.category === currentCategory);
      }
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(item =>
          item.title.toLowerCase().includes(q) ||
          item.tags.some(tag => String(tag).toLowerCase().includes(q))
        );
      }

      grid.replaceChildren();
      if (filtered.length === 0) {
        statusEl.replaceChildren();
        statusEl.append(document.createTextNode("No assets match that search. "));
        const clear = document.createElement("button");
        clear.type = "button";
        clear.textContent = "Clear filters";
        clear.addEventListener("click", () => {
          searchInput.value = "";
          searchQuery = "";
          currentCategory = "All Categories";
          render();
        });
        statusEl.append(clear);
        return;
      }

      statusEl.textContent = `Showing ${filtered.length} assets.`;
      const fragment = document.createDocumentFragment();
      filtered.forEach(item => fragment.append(buildAsset(item)));
      grid.append(fragment);
    }

    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        currentTab = tab.dataset.tab;
        currentCategory = "All Categories";
        tabs.forEach(t => t.setAttribute("aria-pressed", String(t === tab)));
        render();
      });
    });

    searchInput.addEventListener("input", () => {
      searchQuery = searchInput.value.trim();
      render();
    });

    init();
  </script>
</body>
</html>
